<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendQR | Sign In</title>
    <meta name="description" content="QR-Code Attendance Portal - Sign In">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--yellow, #ffe17c);
        }
        .login-nav {
            height: 60px;
            background: var(--yellow, #ffe17c);
            border-bottom: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            box-sizing: border-box;
        }
        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem 3.5rem 1.25rem;
            box-sizing: border-box;
        }
        .login-card-simple {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 14px;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg, 6px 6px 0px #000000);
            box-sizing: border-box;
        }
        .role-switch-container {
            display: flex;
            background: var(--gray-light, #f4f4f5);
            border: 2px solid #000000;
            border-radius: 10px;
            padding: 4px;
            gap: 6px;
            margin-bottom: 1.75rem;
        }
        .role-btn {
            flex: 1;
            padding: 0.7rem 0.85rem;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 7px;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.9rem;
            color: #555;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .role-btn.active {
            background: var(--yellow, #ffe17c);
            color: #000000;
            border-color: #000000;
            box-shadow: 2px 2px 0 #000000;
        }
        .login-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #000000;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            box-sizing: border-box;
            background: #ffffff;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .login-input:focus {
            outline: none;
            background: #fffde7;
            box-shadow: 3px 3px 0 #000000;
        }
        @media (max-width: 600px) {
            .login-nav {
                padding: 0 1rem;
            }
            .login-main {
                padding: 1.5rem 1rem 2.5rem 1rem;
            }
            .login-card-simple {
                padding: 1.75rem 1.35rem;
            }
            .role-btn {
                font-size: 0.82rem;
                padding: 0.6rem 0.4rem;
            }
        }
    </style>
</head>
<body class="dot-bg">

<div class="login-page-wrap">

    <!-- ── Clean Navigation ── -->
    <nav class="login-nav">
        <a class="nb-nav-logo" href="/" style="font-size:1.15rem; gap:0.5rem; text-decoration:none;">
            <div class="nb-nav-logo-icon" style="width:34px; height:34px; border-radius:7px; background:var(--black); display:flex; align-items:center; justify-content:center;">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:20px; height:20px;">
                    <rect x="3" y="3" width="7" height="7" rx="1" fill="#ffe17c"/>
                    <rect x="14" y="3" width="7" height="7" rx="1" fill="#ffe17c"/>
                    <rect x="3" y="14" width="7" height="7" rx="1" fill="#ffe17c"/>
                    <rect x="14" y="14" width="3" height="3" fill="#ffe17c"/>
                    <rect x="18" y="18" width="3" height="3" fill="#ffe17c"/>
                    <rect x="14" y="18" width="3" height="3" fill="#ffe17c"/>
                </svg>
            </div>
            <span>Attend<span style="background:#000; color:#ffe17c; padding:0.1rem 0.35rem; border-radius:4px; margin-left:2px;">QR</span></span>
        </a>
        <div>
            <a href="/register" class="btn btn-sm" style="font-size:0.85rem; padding:0.45rem 0.9rem; font-weight:700;">Create Account →</a>
        </div>
    </nav>

    <!-- ── Spacious Main Container ── -->
    <main class="login-main">
        <div class="login-card-simple">

            <!-- Clean Header without Clutter -->
            <div style="margin-bottom:1.5rem;">
                <h1 style="margin:0 0 0.4rem 0; font-size:1.85rem; font-weight:800; letter-spacing:-0.02em;">Sign In</h1>
                <p style="margin:0; color:#666; font-size:0.92rem;">Enter your credentials to access your attendance portal</p>
            </div>

            {% if error %}
            <div style="background:#ffebee; border:2px solid #c62828; padding:0.75rem 1rem; border-radius:8px; margin-bottom:1.25rem; font-size:0.85rem; color:#b71c1c; font-weight:700;">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <!-- Spacious Role Switcher -->
            <div class="role-switch-container">
                <button type="button" class="role-btn {% if role != 'teacher' %}active{% endif %}" id="btn-student" onclick="setRole('student')">
                    <span>🎓</span> Student
                </button>
                <button type="button" class="role-btn {% if role == 'teacher' %}active{% endif %}" id="btn-teacher" onclick="setRole('teacher')">
                    <span>👨‍🏫</span> Teacher
                </button>
            </div>

            <!-- Login Form -->
            <form action="/login-post" method="POST" id="login-form">
                <input type="hidden" name="role" id="role-input" value="{{ role or 'student' }}">

                <div class="input-group" style="margin-bottom:1.25rem;">
                    <label id="identifier-label" for="identifier-input" style="display:block; font-weight:700; margin-bottom:0.4rem; font-size:0.88rem;">
                        Personal ID (PID) / Email / Roll Number
                    </label>
                    <input type="text" name="identifier" id="identifier-input" 
                           class="login-input"
                           placeholder="e.g. ECS2026001 or aryan@college.edu" 
                           autocomplete="username" required>
                </div>

                <div class="input-group" style="margin-bottom:1.5rem;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                        <label for="password-input" style="font-weight:700; font-size:0.88rem;">Password</label>
                        <span style="font-size:0.75rem; color:#777;">Case sensitive</span>
                    </div>
                    <input type="password" name="password" id="password-input" 
                           class="login-input"
                           placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn" id="login-btn" style="width:100%; padding:0.9rem; font-size:1.02rem; font-weight:800; justify-content:center; box-shadow:3px 3px 0 #000;">
                    Sign In →
                </button>
            </form>

            <!-- Clean, Uncluttered Footer -->
            <div style="margin-top:1.75rem; text-align:center; font-size:0.88rem; color:#555;">
                Don't have an account?
                <div style="margin-top:0.4rem; display:flex; justify-content:center; gap:0.6rem; font-weight:700;">
                    <a href="/register?role=student" style="color:#000; text-decoration:underline;">Register Student</a>
                    <span style="color:#aaa;">•</span>
                    <a href="/register?role=teacher" style="color:#000; text-decoration:underline;">Register Teacher</a>
                </div>
            </div>

        </div>
    </main>

</div>

<script>
    function setRole(selectedRole) {
        const roleInput = document.getElementById('role-input');
        const studentBtn = document.getElementById('btn-student');
        const teacherBtn = document.getElementById('btn-teacher');
        const identifierLabel = document.getElementById('identifier-label');
        const identifierInput = document.getElementById('identifier-input');

        roleInput.value = selectedRole;

        if (selectedRole === 'teacher') {
            studentBtn.classList.remove('active');
            teacherBtn.classList.add('active');
            identifierLabel.textContent = "Teacher ID / Faculty Email";
            identifierInput.placeholder = "e.g. T_VR or vr@college.edu";
        } else {
            teacherBtn.classList.remove('active');
            studentBtn.classList.add('active');
            identifierLabel.textContent = "Personal ID (PID) / Email / Roll Number";
            identifierInput.placeholder = "e.g. ECS2026001 or aryan@college.edu";
        }
    }

    // Initialize state based on server-rendered role
    const initialRole = document.getElementById('role-input').value;
    if (initialRole === 'teacher') {
        setRole('teacher');
    }
</script>
</body>
</html>
